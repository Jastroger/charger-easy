# /opt/juice-charger/config.yaml

# MQTT settings
mqtt:
  broker_host: "mqtt.local"
  broker_port: 1883
  client_id: "JuiceBoosterPi"
  username: null
  password: null
  base_topic: "juicebooster"

# Logging settings
logging:
  file_path: "/opt/juice-charger/charger.log"
  level: "INFO"

# RLC percentages.
# DIP2 ON means GPIO LOW and enables these reductions.
# RLC inputs use pull-downs and are active when the input reads HIGH.
# If several RLC inputs are active, the strongest reduction wins.
rlc_percentages:
  rlc1: 75
  rlc2: 50
  rlc3: 25
  rlc4: 0

# Status LEDs:
# green = EVCC mode active
# blue = RLC mode active
leds:
  enabled: true

# Buzzer settings
buzzer:
  enabled: true
  melodies:
    startup:
      sequence:
        - {f: 3000, d: 400}
        - {f: 0, d: 0}

    car_connected:
      sequence:
        - {f: 2000, d: 100}
        - {f: 0, d: 50}
        - {f: 2000, d: 100}

    start_charging:
      sequence:
        - {f: 3000, d: 400}
        - {f: 0, d: 0}

    stop_charging:
      sequence:
        - {f: 1000, d: 300}

    reject:
      sequence:
        - {f: 3000, d: 200}
        - {f: 0, d: 100}
        - {f: 3000, d: 200}
        - {f: 0, d: 100}
        - {f: 3000, d: 200}
        - {f: 0, d: 0}

# Home Assistant MQTT Discovery
home_assistant:
  discovery: true
  discovery_prefix: "homeassistant"
  device_id: "juice_charger_easy"
  device_name: "Juice Charger Easy"

# PV surplus charging.
# Home Assistant publishes the current grid power to grid_power_topic.
# Default sign convention: positive = grid import, negative = export.
pv:
  grid_power_topic: "juicebooster/ha/gridPower"
  grid_power_export_negative: true
  voltage: 230
  phases: 1
  min_current: 6
  current_step: 1
  reserve_w: 100
  start_delay_seconds: 60
  stop_delay_seconds: 180
  input_timeout_seconds: 60
