# /opt/juice-charger/config.yaml

# MQTT settings
mqtt:
  broker_host: "mqtt.local"
  broker_port: 1883
  client_id: "JuiceBoosterPi"
  username: null
  password: null
  base_topic: "juicebooster"

# Logging settings
logging:
  file_path: "/opt/juice-charger/charger.log"
  level: "INFO"

# RLC percentages.
# DIP2 ON means GPIO LOW and enables these reductions.
# RLC inputs use pull-downs and are active when the input reads HIGH.
# If several RLC inputs are active, the strongest reduction wins.
rlc_percentages:
  rlc1: 75
  rlc2: 50
  rlc3: 25
  rlc4: 0

# Status LEDs:
# green = EVCC mode active
# blue = RLC mode active
leds:
  enabled: true

# Buzzer settings
buzzer:
  enabled: true
  melodies:
    startup:
      sequence:
        - {f: 3000, d: 400}
        - {f: 0, d: 0}

    car_connected:
      sequence:
        - {f: 2000, d: 100}
        - {f: 0, d: 50}
        - {f: 2000, d: 100}

    start_charging:
      sequence:
        - {f: 3000, d: 400}
        - {f: 0, d: 0}

    stop_charging:
      sequence:
        - {f: 1000, d: 300}

    reject:
      sequence:
        - {f: 3000, d: 200}
        - {f: 0, d: 100}
        - {f: 3000, d: 200}
        - {f: 0, d: 100}
        - {f: 3000, d: 200}
        - {f: 0, d: 0}
