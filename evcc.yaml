# EVCC loadpoints + charger configuration example
loadpoints:
  - title: "JUICE Charger Easy"
    charger: juice-booster
    meter: shelly-pm
    phases: 1
    maxcurrent: 16

chargers:
  - name: "juice-booster"
    type: custom
    status:
      source: mqtt
      topic: "juicebooster/status"
    enabled:
      source: mqtt
      topic: "juicebooster/enabled"
    enable:
      source: mqtt
      topic: "juicebooster/enable/set"
    maxcurrent:
      source: mqtt
      topic: "juicebooster/maxCurrent/set"

meters:
  - name: shelly-pm
    type: template
    template: shelly-1pm
    usage: charge
    host: 192.168.178.123
    user:
    password:
    channel: 0

mqtt:
  broker: "mqtt.local"
  user:
  password:
